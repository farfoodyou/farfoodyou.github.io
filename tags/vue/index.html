<script>
(function () {
  var root = document.documentElement;
  var btn = document.getElementById('theme-toggle');
  function label() { if (btn) btn.textContent = root.dataset.theme === 'light' ? '◑ light' : '◐ dark'; }
  label();
  if (btn) btn.addEventListener('click', function () {
    var next = root.dataset.theme === 'light' ? 'dark' : 'light';
    if (next === 'dark') { delete root.dataset.theme; } else { root.dataset.theme = next; }
    try { localStorage.setItem('theme', next); } catch (e) {}
    label();
    var gf = document.querySelector('iframe.giscus-frame');
    if (gf) gf.contentWindow.postMessage(
      { giscus: { setConfig: { theme: next === 'light' ? 'light' : 'dark' } } }, 'https://giscus.app');
  });
  var bar = document.getElementById('progress');
  if (bar) {
    var onScroll = function () {
      var h = document.body.scrollHeight - window.innerHeight;
      bar.style.width = (h > 0 ? (window.scrollY / h) * 100 : 0) + '%';
    };
    window.addEventListener('scroll', onScroll, { passive: true });
    onScroll();
  }
  /* keyboard shortcuts: / search, t theme, j/k prev/next, g h home */
  var toTop = document.createElement('button');
  toTop.id = 'to-top'; toTop.type = 'button'; toTop.textContent = '↑';
  toTop.addEventListener('click', function () { window.scrollTo({ top: 0, behavior: 'smooth' }); });
  document.body.appendChild(toTop);
  window.addEventListener('scroll', function () {
    toTop.classList.toggle('show', window.scrollY > 600);
  }, { passive: true });

  document.addEventListener('keydown', function (e) {
    if (e.target.tagName === 'INPUT' || e.target.tagName === 'TEXTAREA') return;
    if (e.key === '/') { e.preventDefault(); location.href = '/search/'; }
    else if (e.key === 't' && btn) { btn.click(); }
    else if (e.key === 'g') { location.href = '/'; }
  });
  /* 阅读进度百分比 */
  var num = document.getElementById('progress-num');
  if (num && bar) {
    window.addEventListener('scroll', function () {
      var h = document.body.scrollHeight - window.innerHeight;
      num.textContent = Math.round(h > 0 ? (window.scrollY / h) * 100 : 0) + '%';
      num.classList.toggle('show', window.scrollY > 200);
    }, { passive: true });
  }

  /* 目录跟随高亮 */
  var tocLinks = Array.prototype.slice.call(document.querySelectorAll('.toc a'));
  if (tocLinks.length) {
    var heads = tocLinks.map(function (a) {
      return document.getElementById(decodeURIComponent(a.getAttribute('href').slice(1)));
    }).filter(Boolean);
    var setActive = function (el) {
      tocLinks.forEach(function (a) { a.classList.remove('on'); });
      var i = heads.indexOf(el);
      if (i >= 0) tocLinks[i].classList.add('on');
    };
    if ('IntersectionObserver' in window) {
      var seen = [];
      var io = new IntersectionObserver(function (es) {
        es.forEach(function (e) {
          if (e.isIntersecting) seen.push(e.target);
          else seen = seen.filter(function (x) { return x !== e.target; });
        });
        if (seen.length) setActive(seen.sort(function (a, b) { return a.offsetTop - b.offsetTop; })[0]);
      }, { rootMargin: '-64px 0px -70% 0px' });
      heads.forEach(function (h) { io.observe(h); });
    }
  }

  /* 代码块语言角标 */
  document.querySelectorAll('pre > code[class*="language-"]').forEach(function (code) {
    var lang = (code.className.match(/language-([\w+#-]+)/) || [])[1];
    if (!lang) return;
    var tag = document.createElement('span');
    tag.className = 'code-lang';
    tag.textContent = lang;
    code.parentNode.appendChild(tag);
  });

  /* 图片灯箱 */
  (function () {
    var imgs = document.querySelectorAll('.post-content img');
    if (!imgs.length) return;
    var box = document.createElement('div');
    box.className = 'lightbox';
    box.innerHTML = '<img alt=""><p class="lightbox-cap"></p>';
    document.body.appendChild(box);
    var big = box.querySelector('img');
    var cap = box.querySelector('.lightbox-cap');
    imgs.forEach(function (img) {
      img.classList.add('zoomable');
      img.addEventListener('click', function () {
        big.src = img.src;
        cap.textContent = img.alt || '';
        box.classList.add('show');
      });
    });
    box.addEventListener('click', function () { box.classList.remove('show'); });
    document.addEventListener('keydown', function (e) {
      if (e.key === 'Escape') box.classList.remove('show');
    });
  })();

  /* 上一/下一篇快捷键 */
  var prevA = document.querySelector('.post-nav a.prev');
  var nextA = document.querySelector('.post-nav a.next');
  document.addEventListener('keydown', function (e) {
    if (e.target.tagName === 'INPUT' || e.target.tagName === 'TEXTAREA') return;
    if (e.key === 'k' && prevA) location.href = prevA.getAttribute('href');
    if (e.key === 'j' && nextA) location.href = nextA.getAttribute('href');
  });

  /* 字号 */
  var FS_KEY = 'fs-scale';
  var applyFs = function (v) {
    v = Math.min(1.3, Math.max(0.85, Math.round(v * 100) / 100));
    document.documentElement.style.setProperty('--fs-scale', v);
    try { localStorage.setItem(FS_KEY, v); } catch (e) {}
  };
  var curFs = 1;
  try { curFs = parseFloat(localStorage.getItem(FS_KEY)) || 1; } catch (e) {}
  applyFs(curFs);
  var fsm = document.getElementById('fs-minus');
  var fsp = document.getElementById('fs-plus');
  if (fsm) fsm.addEventListener('click', function () { curFs = Math.max(0.85, curFs - 0.05); applyFs(curFs); });
  if (fsp) fsp.addEventListener('click', function () { curFs = Math.min(1.3, curFs + 0.05); applyFs(curFs); });

  document.querySelectorAll('pre').forEach(function (pre) {
    var b = document.createElement('button');
    b.className = 'copy-btn'; b.type = 'button'; b.textContent = 'copy';
    b.addEventListener('click', function () {
      var code = pre.querySelector('code');
      var text = code ? code.innerText : pre.innerText;
      navigator.clipboard.writeText(text).then(function () {
        b.textContent = 'copied!';
        setTimeout(function () { b.textContent = 'copy'; }, 1200);
      });
    });
    pre.appendChild(b);
  });
})();
document.addEventListener('click', function (e) {
  if (e.target && e.target.id === 'copy-link') {
    navigator.clipboard.writeText(location.href).then(function () {
      e.target.textContent = '已复制 ✓';
      setTimeout(function () { e.target.textContent = '复制链接'; }, 1500);
    });
  }
});
</script>
